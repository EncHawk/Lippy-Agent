services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lippy
      POSTGRES_PASSWORD: lippy
      POSTGRES_DB: lippy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lippy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lippy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lippy-postgres:
